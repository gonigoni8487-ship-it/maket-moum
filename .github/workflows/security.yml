# 마트ON 보안 검사: 매주 월요일 아침, main에 올릴 때, PR마다 자동 실행
name: 보안 검사

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: 의존성·비밀값·타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 알려진 취약점 보고서
        run: |
          {
            echo "## 의존성 취약점 (서비스에 들어가는 패키지)"
            echo '```'
            npm audit --omit=dev || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 치명적(critical) 취약점이 있으면 실패
        run: npm audit --omit=dev --audit-level=critical
      - name: 비밀값이 코드에 들어갔는지 검사
        run: |
          # API 키·개인키·관리자 비밀번호 설정값이 저장소에 올라가지 않았는지 확인
          if git grep -nIE '(AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{32,}|MARTON_MANAGER_PIN\s*=\s*["'"'"']?[^"'"'"'\s$]{4,})' -- . ':!docs/**' ':!*.md' ':!.github/workflows/security.yml'; then
            echo "::error::코드에 비밀값으로 보이는 문자열이 있습니다. 지우고 Cloudflare 비밀(Secret)로 옮겨 주세요."
            exit 1
          fi
          echo "비밀값 없음"
      - name: 타입 검사
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p worker

  codeql:
    name: 코드 취약점 분석 (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
